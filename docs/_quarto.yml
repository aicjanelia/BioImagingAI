project:
  type: book
  resources:
  - CNAME

book:
  title: "AI in Microscopy: A BioImaging Guide"
  downloads: "pdf"
  license: "BSD-3"
  repo-url: https://github.com/aicjanelia/BioImagingAI
  cover-image: settings/cover.png
  favicon: settings/favicon.svg
  google-analytics: "G-Y29EKZ8LWD"
  editor: 
    - Owen Puls
    - Rachel Lee
    - Teng-Leong Chew
  chapters:
    - index.qmd
    - 1-intro.qmd
    - part: "Getting Started with AI"
      chapters:
       - 2-primer.qmd
       - 3-llms.qmd
       - 4-architectures.qmd
    - part: "Image Acquisition"
      chapters:
      - 5-training-data.qmd
      - 6-image-restoration.qmd
      - 7-smart-microscopy.qmd
    - part: "Image Analysis"
      chapters:
      - 8-existing-tools.qmd
      - 9-train-models.qmd
      - 10-output-quality.qmd
    - 11-outlook.qmd
    - glossary.qmd
    - references.qmd
  appendices:
    - 6-image-restoration-appendix.qmd

bibliography: references.bib
csl: settings/nature.csl

notebook-links: true

format:
  html:
    theme:
      light: flatly
      dark: darkly
    code-fold: true
    code-summary: "show code"
    link-external-icon: true
    link-external-newwindow: true
    include-after-body: 
      text : |
        <script>
        document.addEventListener('click', (e) => {
          const a = e.target.closest('a.quarto-xref');
          if (!a) return;
          const href = a.getAttribute('data-original-href') || a.getAttribute('href') || '';
          const i = href.indexOf('#');
          if (i < 0) return;
          const norm = p => p.replace(/(index)?\.html$/, '').replace(/\/$/, '');
          const path = href.slice(0, i);
          if (path && norm(new URL(path, location.href).pathname) !== norm(location.pathname)) return;
          const id = decodeURIComponent(href.slice(i + 1));
          const el = [...document.querySelectorAll('[id="' + CSS.escape(id) + '"]')]
            .find(n => !n.closest('[data-tippy-root]'));
          if (!el) return;
          e.preventDefault();
          history.pushState(null, '', '#' + id);
          el.scrollIntoView();
        }, true);
        </script>
  pdf:
    documentclass: scrreprt
    cite-method: biblatex
    header-includes: |
      \usepackage{etoolbox}
      \makeatletter
      \pretocmd{\chapter}{\phantomsection}{}{}
      \pretocmd{\section}{\phantomsection}{}{}
      \pretocmd{\subsection}{\phantomsection}{}{}
      \makeatother

